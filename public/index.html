<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/logic.js" defer></script>
  </head>

  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-lg bg-white shadow-lg rounded-3xl p-8 border border-gray-200">
      <header class="mb-8 text-center">
        <h1 class="text-3xl font-semibold text-gray-800 tracking-tight">To-Do List</h1>
        <p class="text-gray-500 text-sm mt-1">Stay organized and focused</p>
      </header>

      <div class="flex mb-6 shadow-sm">
        <input
          id="taskInput"
          type="text"
          placeholder="Add a new task..."
          class="flex-grow px-4 py-2 text-gray-800 bg-gray-100 rounded-l-xl border border-gray-300 focus:ring-2 focus:ring-indigo-300 focus:outline-none"
        />
        <button
          id="addBtn"
          class="px-5 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-r-xl font-medium transition"
        >
          Add
        </button>
      </div>

      <div class="flex justify-between mb-3 text-sm text-gray-500">
        <button
          id="markAllBtn"
          class="text-indigo-600 hover:text-indigo-800 font-medium transition"
        >
          Mark all complete
        </button>
        <button id="clearBtn" class="text-red-500 hover:text-red-700 font-medium transition">
          Clear completed
        </button>
      </div>

      <ul
        id="taskList"
        class="divide-y divide-gray-200 bg-gray-50 rounded-2xl border border-gray-200 overflow-hidden"
      ></ul>

      <footer class="mt-6 flex justify-between text-sm text-gray-500">
        <span id="taskCount">0 tasks</span>
        <button id="clearAllBtn" class="text-red-500 hover:text-red-700 font-medium transition">
          Delete all
        </button>
      </footer>
    </div>
  </body>
</html>
